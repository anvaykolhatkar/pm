dependencies = [
  "anthropic>=0.112.0",
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx2>=0.1.3",
  "pytest>=8.4.0",
]

[tool.uv]
package = false
